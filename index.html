<!DOCTYPE html>
<html>

<head>
    <title>Student Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 95%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Student Login</h2>

        <form action="home.html">

            <label>Email</label><br>
            <input type="email" placeholder="Enter Email" required><br>

            <label>Password</label><br>
            <input type="password" placeholder="Enter Password" required><br><br>

            <button type="submit">Login</button>

        </form>

        <style>
            body {
                font-family: Arial;
                text-align: center;
                margin-top: 100px;

                background-image: url("std.jpg");
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center;
            }

            input {
                padding: 10px;
                margin: 10px;
                width: 250px;
            }

            button {
                padding: 10px 20px;
                background: #4CAF50;
                color: white;
                border: none;
                cursor: pointer;
            }
        </style>
    </div>

</body>

</html>
